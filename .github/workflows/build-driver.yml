name: Build AIC8800 Wi-Fi and Bluetooth Driver
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork (Bluetooth Branch)
        uses: actions/checkout@v4
        with:
          ref: bluetooth

      - name: Install Debian build dependencies
        run: |
          sudo apt-get update
          # Added 'dwarves' here to provide the pahole utility
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev dwarves

      - name: Fetch and Extract Complete Debian Kernel Framework
        run: |
          BASE_URL="http://ftp.debian.org/debian/pool/main/l/linux"
          SNAPSHOT_URL="http://snapshot.debian.org/archive/debian/20260101T000000Z/pool/main/l/linux"
          
          wget $BASE_URL/linux-headers-6.12.86+deb13-amd64_6.12.86-1_amd64.deb || \
          wget $SNAPSHOT_URL/linux-headers-6.12.86+deb13-amd64_6.12.86-1_amd64.deb
          
          wget $BASE_URL/linux-headers-6.12.86+deb13-common_6.12.86-1_all.deb || \
          wget $SNAPSHOT_URL/linux-headers-6.12.86+deb13-common_6.12.86-1_all.deb

          wget $BASE_URL/linux-kbuild-6.12.86+deb13_6.12.86-1_amd64.deb || \
          wget $SNAPSHOT_URL/linux-kbuild-6.12.86+deb13_6.12.86-1_amd64.deb

          sudo dpkg-deb -x linux-headers-6.12.86+deb13-amd64_6.12.86-1_amd64.deb /
          sudo dpkg-deb -x linux-headers-6.12.86+deb13-common_6.12.86-1_all.deb /
          sudo dpkg-deb -x linux-kbuild-6.12.86+deb13_6.12.86-1_amd64.deb /

      - name: Compile Modules
        run: |
          cd drivers/aic8800
          # Appended explicit override to drop BTF payload checking requirements
          make KDIR="/usr/src/linux-headers-6.12.86+deb13-amd64" CONFIG_DEBUG_INFO_BTF_MODULES=n

      - name: Package Binaries and Firmware
        run: |
          mkdir -p dropzone/firmware
          find drivers/aic8800/ -name "*.ko" -exec cp {} dropzone/ \;
          cp -r fw/aic8800D80 dropzone/firmware/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aic8800-bt-wifi-debian-6.12
          path: dropzone/
