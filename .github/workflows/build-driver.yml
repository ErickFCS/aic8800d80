name: Build AIC8800 Wi-Fi and Bluetooth Driver
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork (Bluetooth Branch)
        uses: actions/checkout@v4
        with:
          ref: bluetooth

      - name: Install Debian build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev

      - name: Fetch and Merge Complete Debian Kernel Headers
        run: |
          mkdir -p merged_headers
          
          # 1. Download both the architecture-specific package and the common package
          BASE_URL="http://ftp.debian.org/debian/pool/main/l/linux"
          SNAPSHOT_URL="http://snapshot.debian.org/archive/debian/20260101T000000Z/pool/main/l/linux"
          
          wget $BASE_URL/linux-headers-6.12.86+deb13-amd64_6.12.86-1_amd64.deb || \
          wget $SNAPSHOT_URL/linux-headers-6.12.86+deb13-amd64_6.12.86-1_amd64.deb
          
          wget $BASE_URL/linux-headers-6.12.86+deb13-common_6.12.86-1_all.deb || \
          wget $SNAPSHOT_URL/linux-headers-6.12.86+deb13-common_6.12.86-1_all.deb

          # 2. Extract both into our tracking directory
          dpkg-deb -x linux-headers-6.12.86+deb13-amd64_6.12.86-1_amd64.deb merged_headers/
          dpkg-deb -x linux-headers-6.12.86+deb13-common_6.12.86-1_all.deb merged_headers/

      - name: Compile Wi-Fi Module
        run: |
          cd drivers/aic8800
          # We resolve KDIR to an immutable, absolute path
          KDIR_PATH="$GITHUB_WORKSPACE/merged_headers/usr/src/linux-headers-6.12.86+deb13-amd64"
          make KDIR="$KDIR_PATH"

      - name: Compile Bluetooth Module
        run: |
          cd drivers/aic8800/aic_btusb
          KDIR_PATH="$GITHUB_WORKSPACE/merged_headers/usr/src/linux-headers-6.12.86+deb13-amd64"
          make KDIR="$KDIR_PATH"

      - name: Package Binaries and Firmware
        run: |
          mkdir -p dropzone/firmware
          cp drivers/aic8800/aic8800_fdrv.ko dropzone/
          cp drivers/aic8800/aic_load_fw/aic_load_fw.ko dropzone/
          cp drivers/aic8800/aic_btusb/aic_btusb.ko dropzone/
          cp -r fw/aic8800D80 dropzone/firmware/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aic8800-bt-wifi-debian-6.12
          path: dropzone/
