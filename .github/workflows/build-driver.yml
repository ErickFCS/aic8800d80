name: Build AIC8800 Wi-Fi and Bluetooth Driver
on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Debian Kernel Version (e.g., 6.12.94)'
        required: true
        type: string
      deb_revision:
        description: 'Debian Package Revision (e.g., 1)'
        required: true
        default: '1'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork (Bluetooth Branch)
        uses: actions/checkout@v4
        with:
          ref: bluetooth

      - name: Install Debian build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev

      - name: Fetch and Extract Complete Debian Kernel Framework
        run: |
          BASE_URL="http://ftp.debian.org/debian/pool/main/l/linux"
          SNAPSHOT_URL="http://snapshot.debian.org/archive/debian/20260101T000000Z/pool/main/l/linux"
          
          wget $BASE_URL/linux-headers-${{ inputs.kernel_version }}+deb13-amd64_${{ inputs.kernel_version }}-${{ inputs.deb_revision }}_amd64.deb || \
          wget $SNAPSHOT_URL/linux-headers-${{ inputs.kernel_version }}+deb13-amd64_${{ inputs.kernel_version }}-${{ inputs.deb_revision }}_amd64.deb
          
          wget $BASE_URL/linux-headers-${{ inputs.kernel_version }}+deb13-common_${{ inputs.kernel_version }}-${{ inputs.deb_revision }}_all.deb || \
          wget $SNAPSHOT_URL/linux-headers-${{ inputs.kernel_version }}+deb13-common_${{ inputs.kernel_version }}-${{ inputs.deb_revision }}_all.deb

          wget $BASE_URL/linux-kbuild-${{ inputs.kernel_version }}+deb13_${{ inputs.kernel_version }}-${{ inputs.deb_revision }}_amd64.deb || \
          wget $SNAPSHOT_URL/linux-kbuild-${{ inputs.kernel_version }}+deb13_${{ inputs.kernel_version }}-${{ inputs.deb_revision }}_amd64.deb

          sudo dpkg-deb -x linux-headers-${{ inputs.kernel_version }}+deb13-amd64_${{ inputs.kernel_version }}-${{ inputs.deb_revision }}_amd64.deb /
          sudo dpkg-deb -x linux-headers-${{ inputs.kernel_version }}+deb13-common_${{ inputs.kernel_version }}-${{ inputs.deb_revision }}_all.deb /
          sudo dpkg-deb -x linux-kbuild-${{ inputs.kernel_version }}+deb13_${{ inputs.kernel_version }}-${{ inputs.deb_revision }}_amd64.deb /

      - name: Compile Modules
        run: |
          cd drivers/aic8800
          # Stub out PAHOLE to completely skip the BTF debugging generation step
          make KDIR="/usr/src/linux-headers-${{ inputs.kernel_version }}+deb13-amd64" PAHOLE=/bin/true

      - name: Package Binaries and Firmware
        run: |
          mkdir -p dropzone/firmware
          find drivers/aic8800/ -name "*.ko" -exec cp {} dropzone/ \;
          cp -r fw/aic8800D80 dropzone/firmware/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aic8800-bt-wifi-debian-6.12
          path: dropzone/
